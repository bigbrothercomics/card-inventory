<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Back Office · All Seeing Inventory</title>
<meta name="robots" content="noindex">
<link rel="icon" href="logo.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#ffffff">
<link rel="stylesheet" href="app.css?v=20">
</head>
<body data-mode="admin">
<header>
  <div class="row">
    <h1 class="brand"><img src="logo.png" alt="">All Seeing Inventory <small>Back office</small></h1>
    <div class="tabs row" style="gap:4px">
      <button data-tab="add" class="on">Add stock</button>
      <button data-tab="stock">Edit stock</button>
      <button data-tab="missing">Missing cards</button>
      <button data-tab="orders">Past orders</button>
      <button data-tab="history">History</button>
    </div>
    <span class="spacer"></span>
    <a class="btn switch" href="./">Switch to sales</a>
    <span class="status" id="sync"></span>
    <button id="export" title="Download the whole inventory as a CSV backup">Export CSV</button>
    <label class="btn" title="Set each listed card's quantity to the file's value">Import CSV…<input type="file" id="importfile" accept=".csv,text/csv" hidden></label>
  </div>
</header>

<main>
  <div id="banner"></div>
  <p class="hint" id="cksummary" style="margin:0 0 10px">Loading Card Kingdom prices…</p>

  <section id="v-add">
    <div class="row">
      <input type="search" id="aq" class="big" placeholder="Card name to add, e.g. Lightning Bolt or vic riva" autocomplete="off" autofocus>
      <button id="go" class="primary">Search</button>
      <label class="chk"><input type="checkbox" id="oos" checked> Show out of stock</label>
    </div>
    <p class="note" id="searchnote">Search shows every printing from Scryfall. Press + to add a copy to stock, − to remove one.</p>
    <div class="grid" id="agrid"></div>
  </section>

  <section id="v-stock" hidden>
    <div class="row">
      <input type="search" id="sq" class="big" placeholder="Filter what's in stock, e.g. vic riva" autocomplete="off">
      <span class="muted" id="stockcount"></span>
    </div>
    <p class="note" id="stocknote"></p>
    <div class="grid" id="stockgrid"></div>
  </section>

  <section id="v-missing" hidden>
    <div class="row">
      <input type="search" id="mq" class="big" placeholder="Add a card we're missing, e.g. Lightning Bolt" autocomplete="off">
      <button id="madd" class="primary">Add to missing</button>
      <input type="search" id="mf" placeholder="Filter the list" autocomplete="off" aria-label="Filter missing cards">
    </div>
    <p class="note" id="missnote">Loading…</p>
    <div class="grid" id="missgrid"></div>
  </section>


  <section id="v-orders" hidden>
    <div class="eform">
      <label>From<input type="date" id="ofrom"></label>
      <label>To<input type="date" id="oto"></label>
      <label>Customer, staff or order #<input type="search" id="oq" placeholder="e.g. Jane, #12" size="18"></label>
      <label>Total at least $<input type="text" id="omin" inputmode="decimal" placeholder="any" size="6"></label>
      <label>Total at most $<input type="text" id="omax" inputmode="decimal" placeholder="any" size="6"></label>
      <label class="chk"><input type="checkbox" id="oshowrev" checked> Show reversed</label>
      <button id="ogo" class="primary">Search</button>
    </div>
    <div class="row" style="gap:6px;margin:-2px 0 8px">
      <span class="muted">Quick:</span>
      <button data-range="today">Today</button><button data-range="yesterday">Yesterday</button><button data-range="7">Last 7 days</button><button data-range="30">Last 30 days</button><button data-range="all">All time</button>
    </div>
    <p class="note" id="onote"></p>
    <div class="salesum" id="osum"></div>
    <div class="salelist" id="olist"></div>
  </section>

  <section id="v-history" hidden>
    <p class="note">Most recent 300 changes by anyone, newest first.</p>
    <div id="hist"></div>
  </section>
</main>
<div id="toast"></div>

<script src="config.js"></script>
<script src="boxes.js?v=17"></script>
<script src="app.js?v=25"></script>
<script src="account.js?v=18"></script>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});</script>
</body>
</html>

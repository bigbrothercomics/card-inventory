<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>All Seeing Inventory</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="app.css?v=11">
</head>
<body data-mode="sell">
<header>
  <div class="row">
    <h1 class="brand"><img src="logo.png" alt="">All Seeing Inventory</h1>
    <div class="tabs row" style="gap:4px">
      <button data-tab="sell" class="on">Sell</button>
      <button data-tab="sales">Sales</button>
    </div>
    <span class="spacer"></span>
    <span class="status" id="sync"></span>
    <input type="text" id="who" placeholder="Your name" size="14" aria-label="Your name">
  </div>
</header>

<main>
  <div id="banner"></div>
  <p class="hint" id="cksummary" style="margin:0 0 10px">Loading Card Kingdom prices…</p>

  <section id="v-sell">
    <div class="searchwrap">
      <div>
        <div class="row">
          <input type="search" id="q" class="big" placeholder="Type any part of a card name, e.g. vic riva" autocomplete="off" autofocus aria-label="Search cards in stock">
        </div>
        <p class="note" id="sellnote">Loading inventory…</p>
        <div class="grid" id="grid" data-cart="1"></div>
      </div>
      <aside class="cart" id="cart" aria-label="Current order"></aside>
    </div>
  </section>

  <section id="v-sales" hidden>
    <div class="salesum" id="salesum"></div>
    <div class="salelist" id="saleslist"></div>
  </section>
</main>
<div id="toast"></div>

<script src="config.js"></script>
<script src="app.js?v=11"></script>
</body>
</html>

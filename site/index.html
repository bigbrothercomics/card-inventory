<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>All Seeing Inventory</title>
<link rel="icon" href="logo.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#ffffff">
<link rel="stylesheet" href="app.css?v=21">
</head>
<body data-mode="sell">
<header>
  <div class="row">
    <h1 class="brand"><img src="logo.png" alt="">All Seeing Inventory</h1>
    <div class="tabs row" style="gap:4px">
      <button data-tab="sell" class="on">Sell</button>
      <button data-tab="email">Email orders</button>
      <button data-tab="orders">Past orders</button>
    </div>
    <span class="spacer"></span>
    <a class="btn switch" href="admin.html">Switch to backend</a>
    <span class="status" id="sync"></span>
  </div>
</header>

<main>
  <div id="banner"></div>
  <p class="hint" id="cksummary" style="margin:0 0 10px">Loading Card Kingdom prices…</p>

  <section id="v-sell">
    <div class="searchwrap">
      <div>
        <div class="row">
          <input type="search" id="q" class="big" placeholder="Type any part of a card name, e.g. vic riva" autocomplete="off" autofocus aria-label="Search cards in stock">
        </div>
        <p class="note" id="sellnote">Loading inventory…</p>
        <div class="grid" id="grid" data-cart="1"></div>
      </div>
      <aside class="cart" id="cart" aria-label="Current order"></aside>
    </div>
  </section>


  <section id="v-email" hidden>
    <div class="inbox" id="einbox"></div>
    <p class="note" id="ethread" hidden></p>
    <div class="eform">
      <label>Customer name<input type="text" id="ecust" placeholder="e.g. Jane Doe" size="22"></label>
      <label>Per-card budget $<input type="text" id="ecard" inputmode="decimal" placeholder="none" size="7"></label>
      <label>Overall budget $<input type="text" id="etotal" inputmode="decimal" placeholder="none" size="7"></label>
      <label class="chk"><input type="checkbox" id="efoil"> Foils OK</label>
      <label class="grow">Notes<input type="text" id="enotes" placeholder="Anything else from their checklist"></label>
    </div>
    <textarea id="elist" rows="6" placeholder="Paste the card list from the email, one card per line (4 Lightning Bolt, 4x Lightning Bolt, Lightning Bolt x4 all work). Order details can go anywhere in the list and fill in the boxes above: name: Jane Doe · budget: $50 · per card budget: $5 · no foils"></textarea>
    <div class="row" style="margin:8px 0">
      <button id="echeck" class="primary">Check list</button>
      <button id="enew" title="Clear the list, the order details and the table">Clear</button>
      <button id="elastpdf" hidden>Download last PDF</button>
      <span class="note" id="enote" style="margin:0"></span>
    </div>
    <div class="legend"><span><i class="sw orange"></i>Orange: over budget</span><span><i class="sw red"></i>Red: out of stock</span><span><i class="sw blue"></i>Blue: foil</span><span class="muted">Tick a card to price it. Ticked cards are removed from inventory when you complete the order.</span></div>
    <div class="etabwrap" id="etable"></div>
    <div class="efoot" id="efoot"></div>
  </section>

  <section id="v-orders" hidden>
    <div class="eform">
      <label>From<input type="date" id="ofrom"></label>
      <label>To<input type="date" id="oto"></label>
      <label>Customer, staff or order #<input type="search" id="oq" placeholder="e.g. Jane, #12" size="18"></label>
      <label>Total at least $<input type="text" id="omin" inputmode="decimal" placeholder="any" size="6"></label>
      <label>Total at most $<input type="text" id="omax" inputmode="decimal" placeholder="any" size="6"></label>
      <label class="chk"><input type="checkbox" id="oshowrev" checked> Show reversed</label>
      <button id="ogo" class="primary">Search</button>
    </div>
    <div class="row" style="gap:6px;margin:-2px 0 8px">
      <span class="muted">Quick:</span>
      <button data-range="today">Today</button><button data-range="yesterday">Yesterday</button><button data-range="7">Last 7 days</button><button data-range="30">Last 30 days</button><button data-range="all">All time</button>
    </div>
    <p class="note" id="onote"></p>
    <div class="salesum" id="osum"></div>
    <div class="salelist" id="olist"></div>
  </section>
</main>
<div id="emodal" class="modal" hidden></div>
<div id="toast"></div>

<script src="config.js"></script>
<script src="boxes.js?v=17"></script>
<script src="app.js?v=34"></script>
<script src="account.js?v=18"></script>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});</script>
</body>
</html>

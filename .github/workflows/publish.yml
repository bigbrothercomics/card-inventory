# Publishes the app to GitHub Pages with a fresh Card Kingdom price file.
# Runs every 6 hours, whenever the app files change, and on demand (Actions tab > Publish > Run workflow).
name: Publish

on:
  schedule:
    - cron: "17 0,6,12,18 * * *"   # every 6 hours: 10:17 AM, 4:17 PM, 10:17 PM, 4:17 AM Pacific standard time (an hour later in daylight time)
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download and slim Card Kingdom prices
        run: node scripts/build-prices.mjs site/prices.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
